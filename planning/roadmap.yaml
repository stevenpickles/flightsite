# FlightSite — Canonical v1 Roadmap
#
# This file is the CANONICAL execution plan (SPEC.md §92). docs/ROADMAP.md is the
# human-readable representation and must be kept consistent with this file.
#
# Schema (SPEC.md §93):
#   id                  three-digit slice number, stable forever, never repurposed
#   title               short slice name
#   phase               phase number (see `phases` below)
#   branch              feature branch name: <id>-<short-description>
#   status              planned | ready | in_progress | review | merged | blocked | deferred
#   depends_on          list of slice ids that must be merged first
#   objective           one-sentence goal
#   scope               in-scope work items
#   out_of_scope        explicitly excluded (deferred or other-slice) work
#   acceptance_criteria testable statements gating the PR
#   required_tests      test layers/cases the PR must add
#   expected_artifacts  files/areas the PR is expected to touch/create
#   preferred_agent     opus | sonnet  (SPEC.md §1; escalation to opus always allowed)
#   risk_level          low | medium | high
#   notes               anything else
#
# Global conventions applying to EVERY slice (not repeated per-slice):
#   - One slice = one numbered branch = one PR into dev, merged with a merge commit.
#   - Each slice gets a GitHub Issue at start; the PR links and closes it.
#   - Conventional Commits; no CHANGELOG updates outside release branches.
#   - dev must remain deployable after every merge (build + tests + migrations +
#     compose + demo mode).
#   - Coverage gates: backend >= 80%, frontend >= 70% global; critical domains higher.
#   - Documentation relevant to the slice is updated within the slice.

version: 2  # v2: Phase 0 review-gate corrections (dependency completions, 009 split into 009/052/053, packed track storage, numeric perf criteria, licensing register)
updated: "2026-08-31"

phases:
  - number: 0
    name: "Planning"
    goal: "Complete planning package, architecture, data model, API design, roadmap, review gate."
  - number: 1
    name: "Foundation"
    goal: "Repository, backend/frontend skeletons, CI, configuration, database, Docker packaging."
  - number: 2
    name: "Ingestion & Live Domain"
    goal: "Decoder ingestion, live aircraft state, sighting lifecycle, live API/WebSocket, demo/replay tooling."
  - number: 3
    name: "Live Map Experience"
    goal: "Map foundation, aircraft rendering, labels, detail panel, filters, setup wizard, settings, E2E foundation."
  - number: 4
    name: "Metadata & Enrichment"
    goal: "Offline metadata import, FAA registry, classification/operator normalization, route enrichment, airport context, overlays."
  - number: 5
    name: "History & Analytics"
    goal: "Aircraft/Sightings pages, analytics, receiver analytics, activity feed, milestones, today-at-a-glance."
  - number: 6
    name: "Alerts & Notifications"
    goal: "Watchlists, rule engine, interesting-aircraft surfaces, browser notifications, alerts page."
  - number: 7
    name: "Operations"
    goal: "Health/diagnostics, backup/restore, database maintenance, retention, data reset."
  - number: 8
    name: "Hardening & Release Qualification"
    goal: "Full E2E, visual regression, accessibility, performance gates, multi-year storage qualification, docs."

# Release checkpoints (SPEC.md §109–113). Releases are prepared on release/vX.Y.Z
# branches from qualified dev; the main merge requires human approval.
releases:
  - version: "v0.1.0"
    after_phase: 3
    theme: "Live radar MVP: ingestion, sightings, live map, demo mode, setup wizard."
  - version: "v0.2.0"
    after_phase: 8
    theme: "Consolidated release: identity completion, history & analytics, alerts
      & notifications, operations, and the Phase 8 hardening pass. (Development
      outpaced the release cadence; the planned v0.2-v0.5 themes shipped together.
      Recorded 2026-09-01.)"
  - version: "v1.0.0"
    after_phase: 8
    theme: "Qualified stable release per SPEC.md §114 definition of done."

# Explicit v1 non-goals (SPEC.md §79) tracked as future backlog, never implemented
# silently during v1.
backlog:
  - multi-receiver deployments
  - built-in authentication (reverse-proxy/app auth)
  - Slack / Home Assistant / email / native mobile push notifications
  - global aircraft overlay
  - aircraft photos (reserved provider seam documented in ADR-0006; no code in v1)
  - historical animated playback (schema-ready in v1; feature deferred)
  - free-form global search
  - data export
  - manual aircraft notes and manual metadata overrides
  - full offline map-region download manager
  - weather integration
  - airport-level historical analytics
  - period-over-period analytics
  - aircraft-follow mode
  - circling / loitering / repeated-pass behavioral detection
  - complex nested boolean alert expressions
  - user-installable plugins
  - Prometheus/Grafana integration
  - automatic self-updater
  - additional decoder adapters (BeastAdapter, SbsAdapter, RemoteReceiverAdapter)
  - scheduled (automatic) aircraft metadata updates

slices:
  # ---------------------------------------------------------------- Phase 1
  - id: "001"
    title: "Backend skeleton"
    phase: 1
    branch: "001-backend-skeleton"
    status: merged
    depends_on: []
    objective: "Establish the Python backend package with app factory, health/readiness endpoints, structured logging, and quality tooling."
    scope:
      - backend/ project managed with uv; package `flightsite`; Python 3.12
      - FastAPI app factory; uvicorn entrypoint
      - GET /api/v1/health and GET /api/v1/ready endpoints with version info
      - structured JSON logging (structlog) with configurable level; rotating file handler scaffold
      - internal counters registry (ingestion failures, db errors, enrichment failures, ws disconnects — counters exist, mostly unused yet)
      - ruff (format+lint), mypy (strict), pytest + pytest-asyncio + coverage configured
    out_of_scope: [ingestion, database, configuration files (slice 004), Docker]
    acceptance_criteria:
      - "`uv run pytest` passes; ruff and mypy clean"
      - "app starts locally; /api/v1/health returns 200 with app version"
      - "readiness endpoint distinguishes started vs ready"
      - "log output is structured JSON with configurable level"
    required_tests: [unit tests for app factory + health/ready endpoints + counters registry]
    expected_artifacts: [backend/pyproject.toml, backend/src/flightsite/, backend/tests/]
    preferred_agent: sonnet
    risk_level: low
    notes: "Foundational slice; minimal by design (SPEC.md §95 justification: nothing exists yet)."

  - id: "002"
    title: "Frontend skeleton"
    phase: 1
    branch: "002-frontend-skeleton"
    status: merged
    depends_on: []
    objective: "Establish the React/TypeScript frontend with navigation shell, theming, and quality tooling."
    scope:
      - frontend/ Vite + React 18 + TypeScript strict
      - Tailwind CSS + shadcn/ui + Lucide; aviation-instrument design tokens (dark default + light theme)
      - app shell with primary navigation (Live Map, Aircraft, Sightings, Analytics, Receiver, Alerts, Settings) and placeholder routes
      - theme toggle persisted in localStorage; respects dark default
      - Zustand store scaffold; TanStack Query client scaffold
      - ESLint + Prettier + tsc + Vitest + React Testing Library configured
    out_of_scope: [map, real pages, API integration]
    acceptance_criteria:
      - "`npm run build`, lint, typecheck, and tests pass"
      - "shell renders all seven nav sections with keyboard-navigable, focus-visible nav"
      - "dark theme is default; toggle persists across reloads"
    required_tests: [component tests for shell/nav/theme persistence]
    expected_artifacts: [frontend/package.json, frontend/src/, frontend/src/components/]
    preferred_agent: sonnet
    risk_level: low

  - id: "003"
    title: "CI pipeline"
    phase: 1
    branch: "003-ci-pipeline"
    status: merged
    depends_on: ["001", "002"]
    objective: "Stand up GitHub Actions quality gates and security scanning as required status checks."
    scope:
      - "backend workflow: ruff, mypy, pytest with coverage gate (>=80%)"
      - "frontend workflow: eslint, prettier check, tsc, vitest with coverage gate (>=70%)"
      - "security workflow: pip-audit, npm audit, gitleaks secret scan, license check"
      - Dependabot config (pip, npm, github-actions, docker)
      - configure required status checks on dev/main branch protection
    out_of_scope: [Docker build workflow (slice 006), E2E in CI (slice 020), container scanning (slice 006)]
    acceptance_criteria:
      - "all workflows pass on a PR from a feature branch"
      - "coverage below threshold fails the build"
      - "required status checks enforced on dev"
    required_tests: [workflows validated by a passing PR run]
    expected_artifacts: [.github/workflows/backend.yml, .github/workflows/frontend.yml, .github/workflows/security.yml, .github/dependabot.yml]
    preferred_agent: sonnet
    risk_level: low

  - id: "004"
    title: "Configuration system"
    phase: 1
    branch: "004-config-system"
    status: merged
    depends_on: ["001"]
    objective: "Implement the canonical config.yaml / secrets.yaml / environment-override configuration model."
    scope:
      - pydantic-settings model covering SPEC.md §30 areas (receiver endpoint, location, units, timezone, display radius, alert radius, sighting timing, retention, map, enrichment, notifications)
      - defaults per Phase 0 decisions (nm/ft/kt; 15s/60s/600s lifecycle; display radius 250 NM; alert radius unlimited; 14-day high-res metric window)
      - "load order: defaults < config.yaml < secrets.yaml < FLIGHTSITE_* env vars"
      - alerts.enabled_templates list in the config model (written by the setup wizard in 018; read by slice 038 when instantiating shipped alert templates)
      - data directory resolution (FLIGHTSITE_DATA_DIR, default /opt/flightsite/data in containers)
      - atomic config write-back (Settings UI will edit the same model); first-run detection
      - internal config API endpoints (GET/PUT /api/internal/config, first-run state) — single owner of config mutation; slices 018/019 consume them
      - secret values never logged or serialized into non-secret API responses
    out_of_scope: [Settings UI, setup wizard]
    acceptance_criteria:
      - "missing config.yaml yields valid defaults and first-run state"
      - "env vars override file values; secrets load from secrets.yaml and env"
      - "config round-trips through write-back preserving comments is NOT required; YAML output is clean and stable"
      - "secret masking verified by test (no secret in logs or config API dump)"
    required_tests: [unit tests for precedence, validation errors, write-back, secret masking, config API tests]
    expected_artifacts: [backend/src/flightsite/config/, backend internal config API, config.example.yaml]
    preferred_agent: opus
    risk_level: medium

  - id: "005"
    title: "Database foundation"
    phase: 1
    branch: "005-database-foundation"
    status: merged
    depends_on: ["001", "004"]
    objective: "Establish SQLite persistence with SQLAlchemy 2.x async, Alembic migrations, WAL configuration, and integrity checks."
    scope:
      - async engine (aiosqlite) with WAL, busy_timeout, synchronous=NORMAL, foreign_keys=ON
      - "single-writer discipline: dedicated writer session pattern; read sessions for queries"
      - Alembic wired to models; migration applied automatically at startup
      - meta table (schema for T0, app-level metadata); T0 write-once semantics
      - startup integrity check (PRAGMA quick_check) with diagnostics on failure
      - migration test harness (empty + fixture upgrade path)
    out_of_scope: [domain tables (arrive with their slices), maintenance jobs (slice 044)]
    acceptance_criteria:
      - "fresh start creates DB in data dir, applies migrations, records nothing until first observation (T0 unset)"
      - "WAL mode and pragmas verified by test"
      - "migration harness upgrades an empty and a fixture DB successfully"
      - "startup integrity failure is surfaced, not silently ignored"
    required_tests: [persistence unit tests, migration tests, pragma verification]
    expected_artifacts: [backend/src/flightsite/db/, backend/src/flightsite/db/migrations/, backend/alembic.ini, backend/tests/db/]
    preferred_agent: opus
    risk_level: medium

  - id: "006"
    title: "Docker packaging"
    phase: 1
    branch: "006-docker-packaging"
    status: merged
    depends_on: ["003", "004", "005"]
    objective: "Package FlightSite as two multi-arch containers with Compose deployment and GHCR publishing."
    scope:
      - backend Dockerfile (multi-stage, non-root, linux/arm64+amd64)
      - frontend Dockerfile (static build served by nginx; proxies /api to backend)
      - compose.yaml with /opt/flightsite/data bind mount; no anonymous volumes; healthchecks
      - "GH Actions workflow: buildx multi-arch build, Trivy container scan, GHCR publish on tags; build+smoke on PRs"
      - "CI smoke test: compose up, health endpoint, compose down"
    out_of_scope: [release automation (release branches), demo-mode container defaults (slice 011 wires flag)]
    acceptance_criteria:
      - "`docker compose up -d` serves frontend shell and healthy backend on a clean host"
      - "all persistent state lands under the bind mount"
      - "images build for arm64 and amd64 in CI; Trivy scan gate wired"
    required_tests: [CI compose smoke test]
    expected_artifacts: [backend/Dockerfile, frontend/Dockerfile, frontend/nginx.conf, compose.yaml, .github/workflows/docker.yml]
    preferred_agent: sonnet
    risk_level: medium

  # ---------------------------------------------------------------- Phase 2
  - id: "007"
    title: "Decoder ingestion adapter"
    phase: 2
    branch: "007-ingestion-adapter"
    status: merged
    depends_on: ["004"]
    objective: "Implement the DecoderAdapter abstraction and ReadsbJsonAdapter polling readsb/dump1090-fa aircraft.json into normalized state updates."
    scope:
      - DecoderAdapter protocol producing normalized AircraftStateUpdate batches (decoder-agnostic domain types)
      - "ReadsbJsonAdapter: aircraft.json polling at configured interval; tolerant parsing of readsb and dump1090-fa variants"
      - position source classification (adsb / mlat / none / other, per the canonical vocabulary in docs/API.md) from decoder fields
      - "malformed-input hardening: bad JSON, missing fields, absurd values never crash ingestion"
      - connection health state machine (connected / degraded / down) with automatic reconnect + backoff
      - connection test service (used later by wizard/settings) as internal endpoint
      - ingestion failure counters wired
    out_of_scope: [live state store, persistence, Beast/SBS adapters]
    acceptance_criteria:
      - "fixtures from real readsb and dump1090-fa outputs normalize correctly, including MLAT and non-positioned aircraft"
      - "decoder outage triggers health transitions and recovery without restart"
      - "malformed payload fuzz tests pass without exceptions escaping the adapter"
      - "no readsb-specific field names appear outside the adapter module"
    required_tests: [ingestion unit tests with real-world fixtures, malformed-input tests, reconnect tests]
    expected_artifacts: [backend/src/flightsite/ingest/, backend/tests/ingest/, fixture files]
    preferred_agent: opus
    risk_level: medium

  - id: "008"
    title: "Live aircraft state store"
    phase: 2
    branch: "008-live-state-store"
    status: merged
    depends_on: ["007"]
    objective: "Maintain the in-memory live aircraft registry with lifecycle timing, derived fields, and provenance."
    scope:
      - live registry keyed by ICAO applying AircraftStateUpdate batches
      - "lifecycle: fresh -> stale (15s) -> removed from live (60s); configurable; monotonic-clock driven"
      - "derived fields: distance/bearing from receiver (great-circle), airborne/on-ground/unknown (decoder-preferred, conservative inference)"
      - non-positioned aircraft retained as first-class live entries
      - field provenance tagging (decoder vs derived) on live state
      - current-track accumulation per live aircraft (full resolution while live)
      - event stream (aircraft appeared / updated / stale / removed) consumed by later slices
      - 500-aircraft update batch benchmarked (informal perf sanity test)
    out_of_scope: [sighting persistence, WebSocket, alert evaluation]
    acceptance_criteria:
      - "lifecycle transitions occur at configured thresholds under simulated time"
      - "non-positioned aircraft appear in live state with correct position source"
      - "distance/bearing correct against known geodesic fixtures"
      - "500-aircraft 1 Hz batch applies in <=100 ms on dev hardware (perf test)"
    required_tests: [domain unit tests with simulated clock, geodesic fixtures, lifecycle edge cases]
    expected_artifacts: [backend/src/flightsite/live/, backend/tests/live/]
    preferred_agent: opus
    risk_level: high
    notes: "Core domain. Critical-coverage area (SPEC.md §84)."

  - id: "009"
    title: "Sighting persistence core"
    phase: 2
    branch: "009-sighting-persistence-core"
    status: merged
    depends_on: ["005", "008"]
    objective: "Persist aircraft and sightings: write-behind worker, open/close lifecycle, flight context, lifetime records, and T0."
    scope:
      - aircraft + sightings tables (Alembic migrations)
      - write-behind persistence worker consuming live events; ingestion never blocks on DB (this worker is the single SQLite writer; later slices that extend it — 031, 033, 035, 052 — must be serialized per the DEVELOPMENT.md parallel-migration rule)
      - sighting open on first observation; close after 10 min absence (configurable); no new sighting until previous closed
      - flight-context fields on sighting (callsign, squawk, ...) kept distinct from aircraft identity
      - aircraft lifetime records maintained (first/last seen, sighting count, cumulative duration, closest_approach_nm/max_range_nm, lowest/highest altitude)
      - T0 set exactly once at first persisted observation
    out_of_scope: [track storage and reception stats (052), unclean-shutdown recovery (053), analytics rollups, alert evaluation, receiver metrics]
    acceptance_criteria:
      - "sighting open/close/gap semantics verified under simulated time, including the no-reopen-before-close rule"
      - "lifetime records and T0 correct across multiple sightings"
      - "ingestion throughput unaffected by artificially slowed writer (backpressure test); hot path performs zero synchronous DB reads/writes"
    required_tests: [domain tests, persistence tests, migration tests, backpressure tests]
    expected_artifacts: [backend/src/flightsite/sightings/, backend/alembic/versions/, backend/tests/sightings/]
    preferred_agent: opus
    risk_level: high
    notes: "Critical-coverage area. Split from the original slice 009 at the Phase 0 review gate (with 052, 053) for reviewability; IDs 052/053 assigned per the no-renumbering rule (SPEC.md §97)."

  # Slices 052/053 live here (phase 2) despite their IDs: they were split out of the
  # original slice 009 during the Phase 0 review gate, and existing IDs are never
  # renumbered or repurposed (SPEC.md §97).
  - id: "052"
    title: "Sighting tracks & reception stats"
    phase: 2
    branch: "052-sighting-tracks"
    status: merged
    depends_on: ["009"]
    objective: "Store sighting tracks (checkpointed while active, simplified and packed at close), reception statistics, and sighting events."
    scope:
      - sighting_track_checkpoints table — row-per-point full-resolution-ish checkpoints written in batches while a sighting is active (bounded loss on power cut); rows deleted at close
      - sighting_tracks table — one row per closed sighting holding the Douglas-Peucker-simplified track as a compact packed encoding of ordered timestamped points (time, lat, lon, altitude, ground speed, track, position_source), point count, encoding version (playback-capable per SPEC.md §19; packed row-per-sighting storage per amended ADR-0005 to satisfy the Pi 4 multi-year budget)
      - per-sighting reception stats (rssi_peak_db/rssi_avg_db/rssi_min_db, message count, position count, duration, % with position)
      - sighting_events table for meaningful changes (callsign change, squawk change, emergency, enrichment arrival)
    out_of_scope: [recovery (053), playback UI]
    acceptance_criteria:
      - "closed sighting stores a simplified, timestamped, ordered, decodable path; simplification error bounded and tested (property tests)"
      - "packed track for a typical sighting is <= 2 KB; checkpoint rows are removed at close"
      - "reception stats match brute-force computation over the update stream"
      - "sighting events emitted exactly once per meaningful change"
    required_tests: [simplification property tests, pack/unpack round-trip tests, persistence tests, migration tests]
    expected_artifacts: [backend/src/flightsite/sightings/tracks.py, migrations]
    preferred_agent: opus
    risk_level: high
    notes: "Critical-coverage area. Extends the slice-009 persistence worker — serialize with other worker-touching slices."

  - id: "053"
    title: "Unclean-shutdown recovery"
    phase: 2
    branch: "053-shutdown-recovery"
    status: merged
    depends_on: ["052"]
    objective: "Recover cleanly from power loss: repair open sightings from checkpoints with bounded data loss and clear diagnostics."
    scope:
      - "startup recovery: sightings left open by unclean shutdown are closed/repaired from checkpoint rows (closure_reason=shutdown_recovery), simplified, and packed"
      - "bounded-loss guarantee: at most one checkpoint batch interval of track data lost"
      - recovery diagnostics (counts, anomalies) surfaced via logs and later the diagnostics API
      - kill -9 / power-cut drill fixtures
    out_of_scope: [database corruption handling beyond WAL recovery (044), backup]
    acceptance_criteria:
      - "kill -9 during active sightings recovers on restart: open sightings closed sanely with closure_reason=shutdown_recovery and bounded track loss (drill test)"
      - "double-crash (crash during recovery) leaves the DB consistent"
      - "recovery outcomes visible in structured logs with counts"
    required_tests: [recovery drill tests, double-crash tests, migration tests if schema touched]
    expected_artifacts: [backend/src/flightsite/sightings/recovery.py]
    preferred_agent: opus
    risk_level: high
    notes: "Critical-coverage area (unclean-shutdown recovery, SPEC.md §84)."

  - id: "010"
    title: "Live API & WebSocket"
    phase: 2
    branch: "010-live-api-websocket"
    status: merged
    depends_on: ["005", "008", "009"]
    objective: "Expose live aircraft state via versioned REST and a snapshot+delta WebSocket stream."
    scope:
      - GET /api/v1/aircraft/current (positioned + non-positioned, provenance, position source)
      - "WS /api/v1/ws/live: snapshot on connect, batched deltas at ~1 Hz, staleness/removal notices, ping/pong"
      - "connection management: slow-consumer handling (drop + resync), disconnect counters"
      - receiver info endpoint (location, site name — non-secret subset)
      - OpenAPI schema exposure for documented read-only endpoints
    out_of_scope: [history endpoints, analytics endpoints, mutation endpoints]
    acceptance_criteria:
      - "REST and WS agree on state for the same instant"
      - "WS client reconnect receives a coherent snapshot"
      - "slow consumer does not stall ingestion or other clients"
      - "OpenAPI docs generated for exposed endpoints"
    required_tests: [API tests, WS integration tests including reconnect and slow-consumer]
    expected_artifacts: [backend/src/flightsite/api/, backend/tests/api/]
    preferred_agent: opus
    risk_level: medium

  - id: "011"
    title: "Demo mode"
    phase: 2
    branch: "011-demo-mode"
    status: merged
    depends_on: ["007", "008"]
    objective: "Provide a deterministic demo adapter simulating rich traffic for development, tests, and visual regression."
    scope:
      - DemoAdapter implementing DecoderAdapter; seeded PRNG; fixed scenario timeline
      - "scenario coverage: commercial, military, government, police, non-positioned Mode S, MLAT, emergency squawks (7500/7600/7700), rare + first-ever aircraft, stale/disappearing aircraft, realistic tracks"
      - activation via config/env flag (FLIGHTSITE_DEMO=1); clearly indicated in health/receiver info
      - "deterministic: same seed + elapsed time => identical state (stable for visual regression)"
    out_of_scope: [capture/replay (slice 012), synthetic multi-year history (slice 050)]
    acceptance_criteria:
      - "demo mode runs the full stack with no decoder and no internet"
      - "two runs with the same seed produce identical update sequences"
      - "all listed scenario types observable within the first simulated 10 minutes"
    required_tests: [determinism tests, scenario coverage tests]
    expected_artifacts: [backend/src/flightsite/demo/, backend/tests/demo/]
    preferred_agent: sonnet
    risk_level: medium

  - id: "012"
    title: "Capture & replay tooling"
    phase: 2
    branch: "012-capture-replay"
    status: merged
    depends_on: ["007"]
    objective: "Developer tool to capture normalized decoder snapshots into compact fixtures and replay them deterministically."
    scope:
      - CLI (backend dev command) to capture normalized update stream for a bounded duration to a compressed fixture
      - ReplayAdapter implementing DecoderAdapter driving fixtures at real or accelerated speed
      - fixture format documented; used by regression tests
    out_of_scope: [end-user playback UI]
    acceptance_criteria:
      - "capture produces a compact fixture from a live or demo source"
      - "replaying a fixture reproduces identical live-state sequences"
      - "at least one ingest regression test consumes a captured fixture"
    required_tests: [round-trip capture/replay tests]
    expected_artifacts: [backend/src/flightsite/devtools/, docs note in DEVELOPMENT.md]
    preferred_agent: sonnet
    risk_level: low

  # ---------------------------------------------------------------- Phase 3
  - id: "013"
    title: "Map foundation"
    phase: 3
    branch: "013-map-foundation"
    status: merged
    depends_on: ["002"]
    objective: "Integrate MapLibre with an abstracted basemap registry, dark aviation default style, range rings, and receiver marker."
    scope:
      - MapLibre GL JS integration on Live Map route
      - basemap registry abstraction; >=2 selectable basemaps; dark aviation-styled default; light-compatible alternative
      - basemap/tile licensing + attribution rendered and documented (ADR for default provider choice must state whether the default requires a user-supplied key and record usage-policy compatibility in docs/LICENSES.md)
      - receiver marker + configurable range rings (unit-aware)
      - opportunistic browser tile caching of recently used tiles
      - graceful degraded mode when tiles unreachable (rings/aircraft still usable)
    out_of_scope: [aircraft rendering, overlays (airports/airspace), offline tile packs]
    acceptance_criteria:
      - "map renders with dark default basemap, attribution, rings at correct radii"
      - "tile outage leaves a usable dark canvas with rings (verified with network blocked)"
      - "basemap switch persists per browser"
    required_tests: [component tests; tile-failure behavior test]
    expected_artifacts: [frontend/src/features/map/, docs/adr/ basemap ADR, docs/LICENSES.md update]
    preferred_agent: sonnet
    risk_level: medium

  - id: "014"
    title: "Live aircraft rendering"
    phase: 3
    branch: "014-live-aircraft-layer"
    status: merged
    depends_on: ["010", "013"]
    objective: "Render live aircraft on the map from the WebSocket stream with hierarchical icons, selection, and stale fading."
    scope:
      - WS client with reconnect/backoff feeding a Zustand live store
      - "aircraft layer: hierarchical silhouette selection plumbing (type -> category -> generic); category/generic fallbacks until slice 024 supplies metadata-driven types; heading rotation; licensed icon set documented in docs/LICENSES.md"
      - selection state; strong selection highlight; current-sighting track polyline for selected aircraft
      - stale fade; removal animation; position-source indicator styling (ADS-B vs MLAT)
      - smooth position interpolation between 1 Hz updates
      - "performance: 500 aircraft at 60fps-target on desktop, usable on Pi-class clients"
    out_of_scope: [labels (015), filters (017), interesting styling (039)]
    acceptance_criteria:
      - "demo mode shows moving, rotating aircraft via the icon hierarchy (category/generic fallback until slice 024 activates metadata-driven icons), selectable with visible track"
