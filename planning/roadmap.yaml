      - "ADR-0013 records the licensing finding (OpenSky's general Terms of Use restrict their data to non-profit research/education, while their FAQ states the aircraft database specifically is unlicensed and outside those terms) and the owner-approved resolution: treat it like the ambiguous Mictronics row, not like the CC BY-NC openAIP rejection"
      - "`flightsite/metadata/sources/opensky.py` downloads `aircraftDatabase.csv`, validates its shape, and normalizes into FlightSite's own schema; never bundled or redistributed"
      - "`metadata.opensky_enabled` (default `false`) gates registration: when off the provider is never constructed and the source does not participate in `Update Aircraft Metadata` at all"
      - "fill-gaps-only precedence below mictronics and faa on the four fields this source adds value on (operator, owner, model, manufacture year); it can never overwrite a value a higher-precedence source supplied"
      - "Settings metadata section carries the toggle plus a concise, factual license note; `docs/LICENSES.md` gains a register row in the same PR per the maintenance rule"
    out_of_scope:
      - "OpenSky's live state-vector API (this slice touches only the static aircraft database CSV)"
      - "bundling or redistributing the dataset in the repo, releases, or container images"
      - "changes to the mictronics or faa adapters, or to their existing precedence ranks"
      - "scheduled/automatic metadata updates (a standing v1 non-goal)"
    acceptance_criteria:
      - "with `metadata.opensky_enabled` false (the default) no OpenSky provider is constructed, no request is made, and the source is absent from the update action and its per-source status"
      - "with the toggle on, an import records a `dataset_version` and populates only fields mictronics and faa left null"
      - "a malformed, truncated, or wrong-shaped download is rejected and leaves the previously imported dataset intact"
      - "the Settings metadata section states the licensing caveat beside the enabling control"
    required_tests:
      - adapter parse/validate tests plus malformed and fuzz-style input tests
      - transactional-failure test asserting prior data survives a failed import
      - precedence tests asserting fill-gaps-only behaviour below mictronics and faa
      - default-off test asserting the provider is never constructed, and a settings toggle round-trip test
    expected_artifacts:
      - docs/adr/0013-opensky-metadata-source.md
      - backend/src/flightsite/metadata/sources/opensky.py
      - backend/src/flightsite/metadata/precedence.py
      - backend/src/flightsite/config/models.py
      - frontend/src/features/settings/
      - docs/LICENSES.md
    preferred_agent: opus
    risk_level: medium
    notes: "Owner-approved opt-in source. Licensing is ambiguous rather than clean, so the posture matches the Mictronics row (fetch-on-demand only) and adds default-off on top; contact@opensky-network.org is recorded in ADR-0013 as the route to firmer ground. Added by Fable outside the phase plan."
