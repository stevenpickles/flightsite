  - id: "068"
    title: "Medium-severity fix bundle"
    phase: 8
    branch: "068-medium-fixes"
    status: merged
    depends_on: ["040", "056", "061", "064", "067"]
    objective: "Clear the five issues slice 067 triaged as severity:medium in one branch, one single-concern commit each, and settle the three of them that were waiting on a decision (issues #104, #105, #114, #129, #145; tracking issue #159)."
    scope:
      - "#129: `ReceiverMetricsService` gains an attach-and-start path for a `StatsJsonPoller` on an already-running service, and the config save that ends the first-run state (slice 056's hot-start) attaches one, so decoder `stats.json` columns fill without a backend restart; `docs/CONFIGURATION.md`'s two `alerts.enabled_templates` rows stop saying templates instantiate only at startup (slice 055 made config save instantiate them)"
      - "#145 F3: live track points are dated with the same fix-time anchor the marker uses (`positionChangedAt`, slice 064) instead of arrival time, so the trail head and the marker share one clock and a slice-061 backfill splices onto like-dated points"
      - "#145 F4: a position-bearing update that omits `seen_pos_s` no longer inherits the previous record's value in `live/aircraft.py`; a stale age is never attached to a new fix"
      - "#104 (decision: keep the marker, give it a write path): a new internal endpoint marks an alert match as notified, idempotently; the browser-notification dispatch calls it once a `Notification` has actually been shown, so the Alerts page's 'Notified' marker reports delivery instead of a constant default; the alert activity events carry the match id the client needs"
      - "#105 (decision: hoist, per SPEC §48's 'while FlightSite is open in the browser'): ADR-0015 moves ownership of the live WebSocket from the Live Map's `AircraftLayer` to the app shell, so alert notifications and the live activity tail are delivered on every FlightSite route; the map-specific teardown (density latch, selection) stays with the map, the stores are reset on socket loss rather than on route change, and the memory a long-lived non-map tab can accumulate stays bounded; `docs/PRODUCT.md` §4.8 and the activity store's ownership note tell the new truth"
      - "#114 (decision: accept the measured cost for v1, document it): ADR-0014 records slice 050's measurement — `sighting_tracks` at ~2.9 KB/row, 2.2× ADR-0005's estimate, 86 % of the file — accepts it for v1, corrects `docs/DATA_MODEL.md` §9's growth prediction and any retention guidance derived from it, and records the page-size and rowid-table remedies with their measured numbers as a backlog item rather than a v1 change"
    out_of_scope:
      - "any storage-layout change for tracks (page size, rowid table): ADR-0014 defers it with numbers, a later slice implements it if the owner wants it"
      - "server-side push while no FlightSite tab is open (SPEC §48 scopes v1 to an open browser)"
      - "the low-severity follow-ups (#96, #98, #100, #112, #138, #147) and the #153 decision"
      - "changing the WebSocket protocol or adding a subscription scope; the shell opens the same socket the map did"
    acceptance_criteria:
      - "completing the setup wizard on a fresh install populates decoder statistics columns within one poll interval, with no restart, and demo mode and already-configured installs are unchanged"
      - "on a selected aircraft the newest live track point carries the marker's fix time, not its arrival time; a backfilled history merges with no dating seam"
      - "an update carrying a position but no `seen_pos_s` yields a record whose `seen_pos_s` is `None`, never the previous record's value"
      - "after a browser notification is shown for a match, `GET /api/v1/alerts/matches` reports it `notified: true`; a match that was never shown stays `false`; marking twice is a no-op"
      - "with a tab on /analytics (or any non-map route) an alert match raises a browser notification and appears in the activity tail on returning to the map; the connection-status chip on the map still reflects the shared socket"
      - "ADR-0014 and ADR-0015 are accepted and indexed in docs/adr/README.md; DATA_MODEL §9's growth figures agree with PERFORMANCE §7.7's measurements"
      - "`Closes #104`, `#105`, `#114`, `#129`, `#145` in the PR body so slice 067's label query stays truthful"
