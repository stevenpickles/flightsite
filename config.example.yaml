# FlightSite configuration — example with the built-in defaults.
#
# Copy to your data directory (default /opt/flightsite/data/config.yaml,
# override with FLIGHTSITE_DATA_DIR) and edit. Every key is optional: anything
# omitted falls back to the default shown here, so a missing config.yaml is a
# valid first-run state rather than an error.
#
# Load order (later wins):
#   1. these built-in defaults
#   2. config.yaml            (this file — non-secret configuration)
#   3. secrets.yaml           (secrets only; never written to config.yaml)
#   4. FLIGHTSITE_* env vars  (nested keys use "__", e.g. FLIGHTSITE_RECEIVER__PORT=8081)
#
# FlightSite rewrites this file when configuration is saved from the Settings
# UI. The output is clean and stable, but comments are not preserved.
#
# Units are nautical miles / feet / knots unless `units: metric` is set; that
# setting affects display only — storage and the API stay canonical (nm/ft/kt,
# UTC timestamps).

# Backend log level: CRITICAL, ERROR, WARNING, INFO or DEBUG.
log_level: INFO

# Write rotating JSON logs to <data_dir>/logs/flightsite.log (SPEC §68).
# Container stdout still receives them either way; the file keeps a history
# that survives a restart, which is what the Health page's recent-error list
# complements rather than replaces.
log_file_enabled: true

# Display unit system: "aviation" (nm/ft/kt) or "metric" (km/m/km-h).
units: aviation

# IANA timezone used to render receiver-local times in the UI.
# Examples: Europe/London, America/New_York, Australia/Sydney.
timezone: UTC

# Live-map display radius in nautical miles. Detections beyond it are still
# stored and still count toward range records and analytics.
display_radius_nm: 250.0

# Alert radius in nautical miles. null means unlimited: alerts fire regardless
# of distance from the receiver.
alert_radius_nm: null

# ADS-B decoder (readsb / dump1090-fa) HTTP JSON endpoint.
receiver:
  host: 127.0.0.1
  port: 8080
  # Path to the aircraft JSON document. tar1090 installs commonly use
  # /data/aircraft.json; some setups use /tar1090/data/aircraft.json.
  path: /data/aircraft.json
  # Poll period in seconds. The decoder publishes at roughly 1 Hz.
  poll_interval_s: 1.0

# Receiver location: the reference point for bearing, distance, range rings,
# closest approach, farthest detection, coverage analytics and alert radius.
# Set latitude and longitude together, or leave both null (the setup wizard
# collects them on first run).
location:
  latitude: null
  longitude: null
  site_name: null
  antenna_height_ft: null

# Sighting lifecycle timing, in seconds. Must increase:
# stale_s < remove_s < close_s.
sighting:
  # No update for this long: the aircraft is shown as stale.
  stale_s: 15.0
  # No update for this long: the aircraft is dropped from the live map.
  remove_s: 60.0
  # No update for this long: the current sighting is closed and persisted.
  close_s: 600.0

# Retention policy. Sightings, tracks and lifetime statistics are kept
# indefinitely; only high-resolution receiver telemetry is pruned.
retention:
  # Days of high-resolution receiver metrics to keep before downsampling.
  # Valid range: 7-30.
  high_res_metric_days: 14

map:
  # Basemap style id from the basemap registry.
  basemap: dark-aviation
  range_rings_enabled: true
  # Range ring radii in nautical miles (up to 10, unique, sorted on save).
  range_ring_radii_nm:
    - 50.0
    - 100.0
    - 150.0
    - 200.0

# Optional online route enrichment (AeroDataBox). FlightSite works fully
# without it. The API key is a SECRET: put it in secrets.yaml or set
# FLIGHTSITE_ENRICHMENT__AERODATABOX_API_KEY — never in this file.
enrichment:
  aerodatabox_enabled: false
  # How long a found route stays cached, in days (1-30). A scheduled flight
  # number flies the same airports for a season, so a week of cache is one
  # lookup instead of one or two a day; a route confirmed on three separate
  # days is then frozen for 30 days automatically.
  route_ttl_days: 7
  # Provider lookups allowed per UTC day. 0 is uncapped; set it if your
  # AeroDataBox credits are finite. When it is spent, lookups stop until
  # midnight UTC and cached routes keep being applied.
  daily_lookup_budget: 0

# Aircraft metadata sources. Mictronics and the FAA registry are always active
# and need nothing here. OpenSky is opt-in because its licensing is unclear:
# OpenSky's general terms restrict their data to non-commercial use, while the
# aircraft database's own page says it is unlicensed and offered as-is. Off
# means off — no provider is constructed and nothing is ever requested. When on,
# it only fills gaps the other sources left empty and never overwrites them.
# See docs/adr/0013-opensky-metadata-source.md.
metadata:
  opensky_enabled: false

# Browser notifications, enabled per alert severity.
notifications:
  enabled: true
  info: false
  interesting: true
  high: true
  critical: true

alerts:
  # Ids of the shipped alert templates to instantiate. Chosen during first-run
  # setup; empty means no alert templates are enabled.
  #
  # Valid ids: military, government, police, emergency_squawk, first_ever,
  # locally_rare, locally_rare_type, watchlist. An id that is not one of these
  # is skipped with a warning in the log rather than refused — a key from
  # another build must not stop the install from starting.
  #
  # Adding an id here instantiates its rule when the file is saved through the
  # Settings UI or the setup wizard. Editing this file by hand instead takes
  # effect on the next restart. Removing an id never deletes a rule, and a
  # shipped rule you delete is not recreated: from first run on, the Alerts
  # page owns the rules.
  #
  # `emergency_squawk` creates no rule — 7500/7600/7700 alert unconditionally
  # and cannot be switched off (SPEC §47).
  enabled_templates: []

# Feeder monitoring (slice 077, docs/adr/0017-feeder-status-sources.md). One
# page under Receiver shows the status of every network this receiver feeds.
# Applies immediately on save; nothing is polled until an entry exists.
#
# `url` is polled by the backend container over the LAN, so it names the
# Docker host as the container sees it (`host.docker.internal`, mapped by
# `extra_hosts` in compose.yaml — see docs/INSTALL.md "Feeders"). `web_url`
# and `local_pages` are links your browser opens, so they name the host as
# you reach it.
#
# Kinds and what each needs: readsb, piaware, fr24 → url; ultrafeeder → url +
# host (the connector's feed host; mlat_port/beast_port optional); opensky_logs,
# docker_health → container (and docker_socket); link_only → nothing.
#
# Per-network stats links usually embed your feeder identity, so they are
# secrets: put them in secrets.yaml, never here. They are reached only through
# FlightSite's internal redirect and never appear in /api/v1 or the page:
#   feeders:
#     stats_urls:
#       flightaware: "https://flightaware.com/adsb/stats/user/..."
#       fr24: "https://www.flightradar24.com/account/feed-stats/?id=..."
feeders:
  poll_interval_s: 15 # 5–120
  # Opt-in and off by default. Mounting the Docker socket is root-equivalent
  # on most hosts (docs/SECURITY.md §10). Without it, log-only signals
  # (OpenSky, ADS-B out on ultrafeeder connectors) read "unknown", never "down".
  docker_socket: null # e.g. /var/run/docker.sock
  entries: []
  # - { name: receiver,    label: Receiver (readsb), kind: readsb,       url: "http://host.docker.internal:8080/",             web_url: "http://fermi.local:8080/" }
  # - { name: flightaware, label: FlightAware,       kind: piaware,      url: "http://host.docker.internal:8081/status.json",  web_url: "http://fermi.local:8081/" }
  # - { name: fr24,        label: FlightRadar24,     kind: fr24,         url: "http://host.docker.internal:8754/monitor.json", web_url: "http://fermi.local:8754/" }
  # - { name: adsbx,       label: ADS-B Exchange,    kind: ultrafeeder,  url: "http://host.docker.internal:8080/", host: feed.adsbexchange.com, mlat_port: 31090, beast_port: 30004, container: ultrafeeder }
  # - { name: aerodatabox, label: AeroDataBox,       kind: ultrafeeder,  url: "http://host.docker.internal:8080/", host: feed.aerodatabox.com,  mlat_port: 31090, beast_port: 30004, container: ultrafeeder }
  # - { name: opensky,     label: OpenSky Network,   kind: opensky_logs, container: opensky }
  local_pages: []
  # - { label: tar1090,     url: "http://fermi.local:8080/" }
  # - { label: graphs1090,  url: "http://fermi.local:8080/graphs1090/" }
  # - { label: SkyAware,    url: "http://fermi.local:8081/" }
  # - { label: FR24 feeder, url: "http://fermi.local:8754/" }
