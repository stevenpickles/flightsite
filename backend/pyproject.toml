[project]
name = "flightsite"
version = "0.6.1"
description = "FlightSite backend: self-hosted ADS-B observatory API and ingestion service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.3",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
]

[project.scripts]
flightsite-serve = "flightsite.__main__:main"
flightsite-capture = "flightsite.devtools.capture:main"
flightsite-backup = "flightsite.backup.cli:main"
flightsite-perf = "flightsite.perf.cli:main"
flightsite-storage-qual = "flightsite.perf.storage_qualification.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightsite"]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "ASYNC", # flake8-async
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["flightsite"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = "flightsite.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not load' --cov=flightsite --cov-report=term-missing --cov-fail-under=80"
markers = [
    # Informal performance sanity checks. They run in the normal suite — a
    # regression should fail an ordinary test run — but the marker lets CI or a
    # developer select (`-m perf`) or exclude (`-m 'not perf'`) them.
    "perf: performance sanity checks with a wall-clock budget",
    # Crash drills that spawn a real application subprocess and kill it. They
    # run in the normal suite — unclean-shutdown recovery is a SPEC §84
    # critical-coverage area and a regression must fail an ordinary run — but
    # they cost seconds rather than milliseconds, so `-m 'not drill'` skips
    # them during a tight edit loop.
    "drill: unclean-shutdown drills that spawn and kill a real process",
    # Sustained-load runs of the slice-049 performance harness. Unlike `perf`
    # and `drill` these are EXCLUDED from the normal suite (see the `-m 'not
    # load'` in addopts above): a sustained 500-aircraft run is minutes of wall
    # clock, and `--realtime` is deliberately bounded by the clock rather than
    # by the CPU. The short smoke version in tests/perf/ runs every time and
    # enforces the same hard gates, so a regression still fails an ordinary
    # run; `-m load` opts into the long version, and `flightsite-perf` is the
    # standalone entry point for real hardware (docs/PERFORMANCE.md).
    "load: sustained-load harness runs, excluded from the default suite",
]

[tool.coverage.run]
source = ["src/flightsite"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
