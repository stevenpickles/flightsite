# Alembic configuration for the FlightSite backend.
#
# This file exists for the `alembic` CLI (`cd backend && uv run alembic ...`).
# The application itself does NOT read it: it builds an equivalent config in
# code (flightsite.db.migrate.build_config) so that migrating at startup does
# not depend on the process's working directory.
#
# `script_location` points inside the installed package so that revisions ship
# in the wheel and a container can migrate itself at startup.
#
# `sqlalchemy.url` is deliberately empty: env.py resolves the database from the
# data directory (FLIGHTSITE_DATA_DIR, else /opt/flightsite/data), so the CLI
# and the app always target the same file.
#
# There is no [loggers] section: FlightSite configures logging through structlog
# (flightsite.logging), and env.py deliberately does not call fileConfig, so a
# CLI migration cannot install a second, differently-formatted logging setup.

[alembic]
script_location = src/flightsite/db/migrations
prepend_sys_path = src
# Revision filenames start with a letter so each module has a valid Python
# module name (mypy and ruff both check the versions directory).
file_template = rev_%%(rev)s_%%(slug)s
sqlalchemy.url =
