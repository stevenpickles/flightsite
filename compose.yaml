# FlightSite Docker Compose deployment.
#
# ---------------------------------------------------------------------------
# Data directory contract (READ BEFORE CHANGING THE BIND MOUNT BELOW)
# ---------------------------------------------------------------------------
# All of FlightSite's persistent state — config.yaml, secrets.yaml, the
# SQLite database (+ -wal/-shm), logs/, and backups/ — lives under ONE host
# bind mount (docs/ARCHITECTURE.md §2.1, docs/adr/0002). There are
# deliberately NO anonymous or named Docker volumes for anything that
# matters: moving this directory plus this file to another compatible host
# moves the whole installation (SPEC §116), and backup is just "stop or
# snapshot, copy the directory".
#
# - Production default (and what this file uses out of the box):
#     /opt/flightsite/data  (host)  ->  /opt/flightsite/data  (container)
#   Create it once on the host with the right ownership before first run,
#   e.g.: sudo mkdir -p /opt/flightsite/data && sudo chown 1000:1000 /opt/flightsite/data
#   (the backend container runs as uid 1000).
# - Local development / CI, where writing to /opt on the host is
#   undesirable or unavailable, override the host side with
#   FLIGHTSITE_HOST_DATA_DIR, e.g.:
#     FLIGHTSITE_HOST_DATA_DIR=./data docker compose up -d
#   The container-side path never changes: the backend image's
#   FLIGHTSITE_DATA_DIR is always /opt/flightsite/data.
# ---------------------------------------------------------------------------

services:
  # ADR-0002: the FastAPI process — ingestion, live state, in-process SQLite
  # persistence, alerts, analytics, APIs. Not reachable directly from the
  # browser; the frontend container is the one origin.
  flightsite-backend:
    image: ghcr.io/stevenpickles/flightsite-backend:latest
    build:
      context: ./backend
    container_name: flightsite-backend
    restart: unless-stopped
    # Passed through from the host shell/`.env` so `FLIGHTSITE_DEMO=1 docker
    # compose up -d` (docs/DEVELOPMENT.md, roadmap slice 011) actually
    # reaches the backend process: compose does not forward arbitrary host
    # variables into a container without an explicit `environment:` entry
    # naming them, and `flightsite.demo.env.demo_enabled()` only ever reads
    # the container's own environment. Unset/empty is the safe default —
    # `demo_enabled()` treats a blank value as falsy, so demo mode stays off
    # unless the host explicitly opts in.
    environment:
      FLIGHTSITE_DEMO: ${FLIGHTSITE_DEMO:-}
    # Network alias "backend" is what frontend/nginx.conf proxies /api/ to.
    networks:
      default:
        aliases:
          - backend
    volumes:
      - ${FLIGHTSITE_HOST_DATA_DIR:-/opt/flightsite/data}:/opt/flightsite/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ADR-0002: nginx serving the built React app and reverse-proxying /api
  # (including WebSocket upgrade) to flightsite-backend. This is the only
  # container the browser talks to.
  flightsite-frontend:
    image: ghcr.io/stevenpickles/flightsite-frontend:latest
    build:
      context: ./frontend
    container_name: flightsite-frontend
    restart: unless-stopped
    # Host port 8090, not 8080. The container side is always 8080 (nginx
    # listens there as an unprivileged user); only the published host port is
    # configurable, via FLIGHTSITE_HOST_PORT.
    #
    # Why 8090 is the default: FlightSite is normally installed on the same
    # host as the ADS-B decoder, and dump1090-fa/tar1090/readsb publish their
    # own web UI on 8080 — the same port `receiver.port` defaults to in
    # config.example.yaml. Defaulting FlightSite there too made a co-resident
    # install fail on first `up` with an "address already in use" bind error,
    # which is a poor first five minutes. 8090 keeps the common case working
    # untouched; anyone who needs a different port sets:
    #   FLIGHTSITE_HOST_PORT=9000 docker compose up -d
    ports:
      - "${FLIGHTSITE_HOST_PORT:-8090}:8080"
    depends_on:
      flightsite-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
