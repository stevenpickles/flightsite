# FlightSite frontend nginx config (served by nginxinc/nginx-unprivileged).
#
# Serves the built React SPA and reverse-proxies /api (including the
# WebSocket upgrade needed by the /api/v1/ws/live feed) to the
# backend container. Per docs/ARCHITECTURE.md §2 and
# docs/adr/0002-two-container-compose-topology.md, the browser talks only to
# this container — one origin, no CORS.
#
# "backend" is the network alias compose.yaml gives the backend service
# (its compose service key is flightsite-backend; see the alias there).

# Upgrade -> Connection mapping for the WebSocket handshake: when the client
# does not send an Upgrade header, Connection must be "close", not
# "upgrade" — otherwise plain HTTP/1.1 keep-alive requests through this
# proxy would break.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # nginxinc/nginx-unprivileged listens unprivileged on 8080 by default;
    # kept explicit here for clarity.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/geo+json
        image/svg+xml;

    # ---- API proxy --------------------------------------------------------
    # Both /api/v1 (documented, read-only) and /api/internal (frontend-only
    # mutations) go to the backend (docs/adr/0007-api-surface-split.md).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade, used by /api/v1/ws/live.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Live data streams at ~1 Hz over a long-lived connection; do not let
        # nginx's read/send timeout reap an idle WebSocket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Hashed static assets ----------------------------------------------
    # Vite fingerprints build output filenames, so a given filename's content
    # never changes: cache it forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- SPA shell ----------------------------------------------------------
    # index.html must always be revalidated so a new deployment is picked up
    # on the browser's next navigation instead of being cached stale.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else: serve the matching static file if present, otherwise
    # fall through to index.html so client-side routing (react-router)
    # handles the path.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
