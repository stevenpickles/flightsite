# Dependabot automated update PRs (docs/SECURITY.md §8, roadmap slice 003).
#
# Weekly update PRs for every ecosystem currently in the repository, grouped so
# routine minor/patch bumps land as a single PR instead of one-per-dependency
# noise; major version bumps are left ungrouped so they get individual review.
#
# The `docker` entry has no Dockerfiles to scan yet (they arrive in roadmap
# slice 006 — see planning/roadmap.yaml). Dependabot simply finds nothing to
# update at "/" until those land; the entry is pre-registered here so docker
# updates start flowing automatically the moment slice 006 merges, with no
# further Dependabot configuration change required.
version: 2
updates:
  # The backend is managed by uv (`backend/uv.lock`); the `pip` ecosystem never
  # read that lock, so no backend dependency PR was ever opened (slice 079).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # vitest and its @vitest/* plugins must move in lock-step — a major bump
      # of one without the other fails `npm ci` on the peer range (slice 079).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The stack pins Python 3.12 (CLAUDE.md: a change needs an ADR); a tag
      # bump to 3.13+ is a stack change, not a patch, however it is grouped.
      - dependency-name: "python"
        versions: [">=3.13"]
      # Only even-numbered Node majors get long-term support; the builder
      # image moves between LTS lines deliberately (slice 079 moved it to 24).
      - dependency-name: "node"
        versions: ["23.x", "25.x", "27.x", "29.x"]
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
